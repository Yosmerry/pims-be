spring:
  application:
    name: pims-be
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
pims:
  auth:
    access-token-expires-in: ${ACCESS_TOKEN_EXPIRES_IN:900}
    refresh-token-expires-in: ${REFRESH_TOKEN_EXPIRES_IN:86400}
    jwt-secret: ${JWT_SECRET}
    cookie-secure: ${COOKIE_SECURE:true}
  image:
    storage-directory: ${IMAGE_STORAGE_DIRECTORY:uploads/images}
    max-file-size: ${IMAGE_MAX_FILE_SIZE:5242880}
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
